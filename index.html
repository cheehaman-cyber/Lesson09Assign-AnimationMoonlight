<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlight Party</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pompiere&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="Style/style.css">
</head>

<body>
    <main class="invitation">
        <div class="moon">🌙</div>
            <p class="small-title">You´re Invited</p>
            <h1>Moonlight Party</h1>
            <p class="subtitle">You’re invited to a magical evening under the stars!</p>

            <a 
               
                class="party-button animate__animated animate__pulse animate__delay-2s animate__infinite"
                href="#details"
            >
                Explore the evening ↓
            </a>

            <hr class="divider">

            <section id="details">
                <h2>Meet under the stars</h2>
                <p>📅 24 October 2026 · 7:00 PM</p>
                <p>📍 The Secret Garden</p>
                <p>Wear something sparkly. Bring your favourite person!</p>
        </section>


        
    </main>


</body>
</html>
